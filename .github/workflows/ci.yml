name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest (SQLite)
        run: uv run pytest

  # Same suite on real Postgres (production uses Neon). Throwaway container, no secrets.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: askdata
          POSTGRES_PASSWORD: askdata
          POSTGRES_DB: askdata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askdata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://askdata:askdata@localhost:5432/askdata_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --frozen
      - name: Migrations apply cleanly and match models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Pytest (Postgres)
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t askdata:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name askdata -p 8000:8000 askdata:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs askdata
          exit 1
