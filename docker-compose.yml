services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside compose, reach Ollama by service name (or the host's Ollama via host.docker.internal).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://ollama:11434}
    volumes:
      - askdata-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional local LLM. Start with: docker compose --profile ollama up
  # Then pull the model once: docker compose exec ollama ollama pull qwen2.5:7b-instruct
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  askdata-data:
  ollama-models:
