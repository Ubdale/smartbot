[project]
name = "askdata"
version = "0.1.0"
description = "Chat with your business data. The LLM interprets the question; code computes the answer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "psycopg[binary]>=3.2",
    "duckdb>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.28",
    "cachetools>=5.5",
    "rapidfuzz>=3.10",
    "boto3>=1.35",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-calamine>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-cachetools>=5.5",
    "moto[s3]>=5.0",
    "boto3-stubs[s3]>=1.35",
    "types-openpyxl>=3.1",
    "fpdf2>=2.8",
    "xlwt>=1.3",
    "odfpy>=1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "error",
    # Third-party: Starlette nudging toward httpx2; harmless for TestClient.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "N", "C4", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S608", "PT018"]
"scripts/**" = ["S311"]  # seeded demo data, not crypto
"tests/conftest.py" = ["S101", "S105", "S106", "S107", "S608", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts", "alembic/env.py"]

[[tool.mypy.overrides]]
module = ["alembic.*", "xlwt"]
ignore_missing_imports = true
